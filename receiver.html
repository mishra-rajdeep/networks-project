<!DOCTYPE html>
<html>
<head><title>Receiver</title></head>
<body>
    <h2>Optical Receiver</h2>

    <div style="position: relative; width: 100%; height: 70vh; overflow: hidden;" id="cam-box">
        <video id="vid" autoplay playsinline style="width: 100%; height: 100%;"></video>
        <div id="crosshair" style="position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; border: 2px solid red; transform: translate(-50%, -50%); pointer-events: none;"></div>
    </div>
    
    <br>
    <label>Zoom: <input type="range" id="zoom" min="1" max="5" step="0.1" value="1" style="width: 90vw;"></label>
    <br><br>
    <b id="col_name">Waiting...</b>
    <br><br>
    <div id="out" style="border: 1px solid black;"></div>

    <script src="receiver.js"></script>
</body>
</html>
