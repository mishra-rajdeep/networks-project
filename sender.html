<!DOCTYPE html>
<html>
<head><title>Sender</title></head>
<body>
    <h2>Optical Sender</h2>

    <label>Orig Data:</label>

    <div id="box" style="width: 300px; height: 300px; border: 2px solid black;"></div>

    <script src="sender.js"></script>
</body>
</html>
